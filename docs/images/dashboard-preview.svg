<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background:#090d16; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="spendGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Browser Window Chrome -->
  <rect x="0" y="0" width="1200" height="42" fill="#0b1120" rx="12"/>
  <rect x="0" y="30" width="1200" height="12" fill="#0b1120"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#10b981"/>
  
  <!-- Address Bar -->
  <rect x="360" y="8" width="480" height="26" rx="6" fill="#1e293b"/>
  <path d="M485 18 a 3 3 0 0 1 6 0 v 2 h -6 z m -2 2 h 10 v 6 h -10 z" fill="#94a3b8"/>
  <text x="502" y="25" fill="#94a3b8" font-size="12" font-family="monospace">http://localhost:3000/app/dashboard</text>
  
  <!-- Sidebar -->
  <rect x="0" y="42" width="220" height="738" fill="#0d1527"/>
  <line x1="220" y1="42" x2="220" y2="780" stroke="#1e293b" stroke-width="1"/>

  <!-- Logo -->
  <g transform="translate(24, 66)">
    <rect x="0" y="0" width="28" height="28" rx="6" fill="#3b82f6"/>
    <path d="M8 8 L20 8 L20 12 L12 12 L12 14 L18 14 L18 18 L12 18 L12 20 L20 20" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="19" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="-0.5">StackAudit</text>
    <rect x="122" y="5" width="24" height="15" rx="4" fill="#1e3a8a"/>
    <text x="126" y="16" fill="#60a5fa" font-size="9" font-weight="700">V0</text>
  </g>

  <!-- Sidebar Nav Items -->
  <g transform="translate(16, 124)">
    <!-- Active Item: Dashboard -->
    <rect x="0" y="0" width="188" height="36" rx="6" fill="#1e293b"/>
    <path d="M14 12 h8 v8 h-8 z M14 22 h8 v4 h-8 z M24 12 h8 v4 h-8 z M24 18 h8 v8 h-8 z" fill="#60a5fa" transform="translate(0, -2) scale(0.7)"/>
    <text x="40" y="22" fill="#60a5fa" font-size="13" font-weight="600">Dashboard</text>

    <!-- Usage Explorer -->
    <text x="40" y="62" fill="#94a3b8" font-size="13">Usage Explorer</text>
    <!-- Workloads -->
    <text x="40" y="102" fill="#94a3b8" font-size="13">Workloads</text>
    <!-- Outcomes -->
    <text x="40" y="142" fill="#94a3b8" font-size="13">Outcomes (CPO)</text>
    <!-- Audits -->
    <text x="40" y="182" fill="#94a3b8" font-size="13">Audit Findings</text>
    <!-- Alerts with badge -->
    <text x="40" y="222" fill="#94a3b8" font-size="13">Alerts</text>
    <rect x="156" y="208" width="18" height="18" rx="9" fill="#dc2626"/>
    <text x="162" y="221" fill="#ffffff" font-size="11" font-weight="700">2</text>
    
    <!-- Settings -->
    <text x="40" y="262" fill="#94a3b8" font-size="13">Settings &amp; Keys</text>
  </g>

  <!-- Workspace Badge at Bottom Sidebar -->
  <g transform="translate(16, 720)">
    <rect x="0" y="0" width="188" height="40" rx="8" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="20" r="10" fill="#3b82f6"/>
    <text x="16" y="24" fill="#ffffff" font-size="11" font-weight="700">A</text>
    <text x="38" y="18" fill="#f8fafc" font-size="12" font-weight="600">Acme AI Lab</text>
    <text x="38" y="31" fill="#64748b" font-size="10">Local Workspace</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(252, 66)">
    <!-- Header -->
    <text x="0" y="20" fill="#f8fafc" font-size="22" font-weight="700">AI Cost Overview</text>
    <text x="0" y="40" fill="#64748b" font-size="13">Workload attribution, prompt caching efficiency, and cost per outcome</text>
    
    <!-- Time Selector -->
    <rect x="790" y="4" width="126" height="32" rx="6" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
    <text x="806" y="24" fill="#f8fafc" font-size="12" font-weight="500">Last 30 Days ▾</text>

    <!-- 4 Top KPI Cards -->
    <g transform="translate(0, 60)">
      <!-- Card 1: Total Spend -->
      <rect x="0" y="0" width="216" height="96" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="24" fill="#94a3b8" font-size="12" font-weight="500">TOTAL AI SPEND</text>
      <text x="16" y="58" fill="#f8fafc" font-size="26" font-weight="700">$1,482.35</text>
      <text x="16" y="80" fill="#10b981" font-size="11" font-weight="600">▲ +14.2%</text>
      <text x="74" y="80" fill="#64748b" font-size="11">vs previous 30d</text>

      <!-- Card 2: Cost Per Outcome -->
      <rect x="232" y="0" width="216" height="96" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
      <text x="248" y="24" fill="#94a3b8" font-size="12" font-weight="500">COST / OUTCOME (CPO)</text>
      <text x="248" y="58" fill="#38bdf8" font-size="26" font-weight="700">$0.042</text>
      <text x="248" y="80" fill="#94a3b8" font-size="11">ticket_resolved · 35.2K</text>

      <!-- Card 3: AI Tokens -->
      <rect x="464" y="0" width="216" height="96" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
      <text x="480" y="24" fill="#94a3b8" font-size="12" font-weight="500">TOKEN CONSUMPTION</text>
      <text x="480" y="58" fill="#f8fafc" font-size="26" font-weight="700">412.8M</text>
      <text x="480" y="80" fill="#a855f7" font-size="11" font-weight="600">48.2%</text>
      <text x="522" y="80" fill="#64748b" font-size="11">prompt cache hit rate</text>

      <!-- Card 4: Active Alerts -->
      <rect x="696" y="0" width="220" height="96" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
      <text x="712" y="24" fill="#94a3b8" font-size="12" font-weight="500">ACTIVE ANOMALIES</text>
      <text x="712" y="58" fill="#f87171" font-size="26" font-weight="700">2 Alerts</text>
      <text x="712" y="80" fill="#ef4444" font-size="11" font-weight="600">1 High Severity</text>
      <text x="802" y="80" fill="#64748b" font-size="11">· 1 Medium</text>
    </g>

    <!-- Mid Section: Spend Trend Chart & Workload Breakdown -->
    <g transform="translate(0, 176)">
      <!-- Spend Chart Box -->
      <rect x="0" y="0" width="560" height="230" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="26" fill="#f8fafc" font-size="14" font-weight="600">Daily Spend Trend (30 Days)</text>
      <text x="420" y="26" fill="#60a5fa" font-size="12" font-weight="500">Avg $49.41 / day</text>
      
      <!-- Chart Grid Lines -->
      <line x1="40" y1="60" x2="520" y2="60" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="40" y1="100" x2="520" y2="100" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="40" y1="140" x2="520" y2="140" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="40" y1="180" x2="520" y2="180" stroke="#334155" stroke-width="1"/>

      <!-- Chart Labels -->
      <text x="16" y="64" fill="#475569" font-size="10">$80</text>
      <text x="16" y="104" fill="#475569" font-size="10">$50</text>
      <text x="16" y="144" fill="#475569" font-size="10">$20</text>
      <text x="40" y="196" fill="#475569" font-size="10">Oct 16</text>
      <text x="160" y="196" fill="#475569" font-size="10">Oct 23</text>
      <text x="280" y="196" fill="#475569" font-size="10">Oct 30</text>
      <text x="400" y="196" fill="#475569" font-size="10">Nov 06</text>
      <text x="495" y="196" fill="#475569" font-size="10">Nov 15</text>

      <!-- SVG Curve Area & Line -->
      <path d="M 40 155 Q 80 148 110 135 T 180 140 T 250 115 T 320 125 T 390 90 T 450 100 T 520 72 L 520 180 L 40 180 Z" fill="url(#spendGrad)"/>
      <path d="M 40 155 Q 80 148 110 135 T 180 140 T 250 115 T 320 125 T 390 90 T 450 100 T 520 72" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Current Highlight Point -->
      <circle cx="520" cy="72" r="5" fill="#3b82f6" stroke="#0f172a" stroke-width="2"/>
      <rect x="440" y="44" width="75" height="22" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <text x="448" y="59" fill="#f8fafc" font-size="11" font-weight="600">$74.20 peak</text>

      <!-- Workload Breakdown Box -->
      <rect x="580" y="0" width="336" height="230" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
      <text x="600" y="26" fill="#f8fafc" font-size="14" font-weight="600">Workload Spend Attribution</text>

      <!-- Workload 1 -->
      <text x="600" y="60" fill="#f8fafc" font-size="12" font-weight="500">Support Copilot</text>
      <text x="860" y="60" fill="#94a3b8" font-size="12">42.5%</text>
      <rect x="600" y="68" width="296" height="6" rx="3" fill="#1e293b"/>
      <rect x="600" y="68" width="126" height="6" rx="3" fill="#3b82f6"/>

      <!-- Workload 2 -->
      <text x="600" y="100" fill="#f8fafc" font-size="12" font-weight="500">Document Extraction Pipeline</text>
      <text x="860" y="100" fill="#94a3b8" font-size="12">31.2%</text>
      <rect x="600" y="108" width="296" height="6" rx="3" fill="#1e293b"/>
      <rect x="600" y="108" width="92" height="6" rx="3" fill="#10b981"/>

      <!-- Workload 3 -->
      <text x="600" y="140" fill="#f8fafc" font-size="12" font-weight="500">Code Review Agent</text>
      <text x="860" y="140" fill="#94a3b8" font-size="12">18.1%</text>
      <rect x="600" y="148" width="296" height="6" rx="3" fill="#1e293b"/>
      <rect x="600" y="148" width="54" height="6" rx="3" fill="#a855f7"/>

      <!-- Workload 4 -->
      <text x="600" y="180" fill="#f8fafc" font-size="12" font-weight="500">Ad-hoc Queries / Research</text>
      <text x="868" y="180" fill="#94a3b8" font-size="12">8.2%</text>
      <rect x="600" y="188" width="296" height="6" rx="3" fill="#1e293b"/>
      <rect x="600" y="188" width="24" height="6" rx="3" fill="#f59e0b"/>
    </g>

    <!-- Bottom Section: Active Anomalies Table -->
    <g transform="translate(0, 426)">
      <rect x="0" y="0" width="916" height="236" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="26" fill="#f8fafc" font-size="14" font-weight="600">Active Audit Findings &amp; Heuristic Anomalies</text>
      <text x="760" y="26" fill="#38bdf8" font-size="12">View all 14 audits →</text>

      <!-- Table Header -->
      <line x1="20" y1="44" x2="896" y2="44" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="60" fill="#64748b" font-size="11" font-weight="600">SEVERITY</text>
      <text x="110" y="60" fill="#64748b" font-size="11" font-weight="600">CATEGORY</text>
      <text x="240" y="60" fill="#64748b" font-size="11" font-weight="600">WORKLOAD</text>
      <text x="430" y="60" fill="#64748b" font-size="11" font-weight="600">FINDING EVIDENCE &amp; IMPACT</text>
      <text x="810" y="60" fill="#64748b" font-size="11" font-weight="600">ACTION</text>
      <line x1="20" y1="70" x2="896" y2="70" stroke="#1e293b" stroke-width="1"/>

      <!-- Row 1 -->
      <rect x="20" y="84" width="48" height="20" rx="4" fill="#7f1d1d"/>
      <text x="28" y="98" fill="#fca5a5" font-size="10" font-weight="700">HIGH</text>
      <text x="110" y="98" fill="#f8fafc" font-size="12" font-weight="500">COST_DRIFT</text>
      <text x="240" y="98" fill="#94a3b8" font-size="12">Support Copilot</text>
      <text x="430" y="98" fill="#cbd5e1" font-size="12">Daily spend grew +34.2% over 14d baseline without outcome increase</text>
      <rect x="806" y="82" width="80" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="818" y="98" fill="#f8fafc" font-size="11">Investigate</text>

      <!-- Row 2 -->
      <line x1="20" y1="120" x2="896" y2="120" stroke="#1e293b" stroke-width="0.5"/>
      <rect x="20" y="134" width="60" height="20" rx="4" fill="#78350f"/>
      <text x="28" y="148" fill="#fcd34d" font-size="10" font-weight="700">MEDIUM</text>
      <text x="110" y="148" fill="#f8fafc" font-size="12" font-weight="500">EFFICIENCY</text>
      <text x="240" y="148" fill="#94a3b8" font-size="12">Document Extraction</text>
      <text x="430" y="148" fill="#cbd5e1" font-size="12">Prompt token bloat detected (output ratio &lt; 2.8%, low cache reuse)</text>
      <rect x="806" y="132" width="80" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="818" y="148" fill="#f8fafc" font-size="11">Investigate</text>

      <!-- Row 3 -->
      <line x1="20" y1="170" x2="896" y2="170" stroke="#1e293b" stroke-width="0.5"/>
      <rect x="20" y="184" width="42" height="20" rx="4" fill="#1e3a8a"/>
      <text x="28" y="198" fill="#93c5fd" font-size="10" font-weight="700">INFO</text>
      <text x="110" y="198" fill="#f8fafc" font-size="12" font-weight="500">MODEL_MIX</text>
      <text x="240" y="198" fill="#94a3b8" font-size="12">Code Review Agent</text>
      <text x="430" y="198" fill="#cbd5e1" font-size="12">Shifted 42% volume from Claude 3.5 Sonnet to Haiku (saving ~$112/wk)</text>
      <rect x="806" y="182" width="80" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="824" y="198" fill="#94a3b8" font-size="11">Dismiss</text>
    </g>
  </g>
</svg>
