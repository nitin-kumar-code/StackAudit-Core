name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npm run typecheck

    - name: Lint
      run: npm run lint

    - name: Run Unit Tests
      run: npm run test:unit

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: 2.122.0

    - name: Start Supabase Local Stack
      run: supabase start

    - name: Export disposable local Supabase credentials
      run: |
        SERVICE_ROLE_KEY="$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY=//p' | tr -d '"')"
        if [ -z "$SERVICE_ROLE_KEY" ]; then
          echo "Could not read the local Supabase service-role key from the CLI."
          exit 1
        fi
        echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
        echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      
    - name: Reset local database and validate migrations
      run: supabase db reset

    - name: Run SQL analytics tests (pgTAP)
      run: supabase test db

    - name: Production build
      run: npm run build

    - name: Run Integration Tests
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
          echo "Error: SUPABASE_SERVICE_ROLE_KEY is required but missing in CI environment!"
          exit 1
        fi
        npm run test:integration
